<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>RestoPOS — Restaurant Point of Sale</title>

  <!-- The Emoji Favicon to stop the 404 Error -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        },

    };

  <link rel="stylesheet" href="./assets/css/styles.css" />

<body class="bg-slate-100 text-slate-800 antialiased">
  <div id="app" class="h-full"></div>
  <script type="module" src="./assets/js/app.js"></script>

    


    


    


    <!-- QUICK_TAKEAWAY_SCRIPT -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        setInterval(() => {
          const elements = Array.from(document.querySelectorAll('button, a, div'));
          const ordersTab = elements.find(el => el.textContent.trim() === 'Orders' && el.offsetParent !== null);
          
          if (ordersTab && !document.getElementById('quick-takeaway-btn')) {
            const btn = document.createElement('button');
            btn.id = 'quick-takeaway-btn';
            btn.className = 'ml-4 px-4 py-1.5 bg-green-600 text-white text-sm font-bold rounded-md hover:bg-green-700 transition shadow-sm';
            btn.textContent = '🛍️ Quick Takeaway';
            
            btn.onclick = () => {
              // We don't need a fake UUID anymore.
              // We set tableId to null so the database accepts it.
              const tempTable = {
                id: null,             // No table ID for takeaway
                name: 'Takeaway',     // Display name
                section_id: 'takeaway',
                status: 'occupied',
                capacity: 1,
                is_takeaway: true
              };
              
              if (window.store) {
                 // Set the active table in the UI
                 window.store.patch('ui', { activeTable: tempTable });
                 
                 // Set the cart to have no table ID and order type 'takeaway'
                 window.store.patch('cart', { 
                     tableId: null,     // <--- This fixes the foreign key error
                     orderType: 'takeaway' 
                 });
              }
              
              // Navigate to POS tab
              const posTab = elements.find(el => el.textContent.trim() === 'POS' && el.offsetParent !== null);
              if (posTab) posTab.click();
              
              // Auto-click Takeaway button on POS screen to ensure UI updates
              setTimeout(() => {
                const posTakeawayBtn = Array.from(document.querySelectorAll('button')).find(b => b.textContent.trim().toLowerCase() === 'takeaway');
                if (posTakeawayBtn) posTakeawayBtn.click();
              }, 400);
            };
            
            ordersTab.parentElement.appendChild(btn);
          }
        }, 500);
      });
    </script>
    <!-- END_QUICK_TAKEAWAY_SCRIPT -->

</body>
</html>
